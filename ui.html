<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Trip Planner</title>

  <style>
    body {
      font-family: Arial;
      max-width: 850px;
      margin: 40px auto;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    pre {
      background: #111;
      color: #eee;
      padding: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Trip Planner</h1>

    <label>Starting Location *</label>
    <input id="origin" placeholder="New York">

    <label>Destination *</label>
    <input id="destination" placeholder="Tokyo">

    <label>Number of Travelers *</label>
    <input id="travelers" type="number" value="1" min="1">

    <label>Budget (optional)</label>
    <input id="budget" type="number">

    <label>Days (optional)</label>
    <input id="days" type="number">

    <label>Interests (optional)</label>
    <textarea id="interests" placeholder="food, culture"></textarea>

    <button onclick="planTrip()">Plan Trip</button>

    <h2>Result</h2>
    <pre id="result"></pre>
  </div>

  <script>
    async function planTrip() {
      const origin = document.getElementById("origin").value.trim();
      const destination = document.getElementById("destination").value.trim();
      const travelers = document.getElementById("travelers").value;

      const budget = document.getElementById("budget").value;
      const days = document.getElementById("days").value;
      const interestsRaw = document.getElementById("interests").value;

      if (!origin || !destination || !travelers) {
        document.getElementById("result").textContent =
          "Please fill required fields.";
        return;
      }

      const body = {
        origin: origin,
        destination: destination,
        travelers: Number(travelers),
        interests: interestsRaw
          ? interestsRaw.split(",").map(x => x.trim()).filter(Boolean)
          : []
      };

      if (budget) body.budget_usd = Number(budget);
      if (days) body.days = Number(days);

      document.getElementById("result").textContent = "Loading...";

      const res = await fetch("/plan-trip", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });

      const data = await res.json();

      document.getElementById("result").textContent =
        data.plan || JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
